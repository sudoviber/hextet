# /etc/config/hextet —— hextet procd 服务的 uci 配置
#
# 这是「服务如何启动」的 uci 配置，不是 hextet.toml 本身。
# 真正的节点配置在 config_file 指向的 TOML 里（默认 /etc/hextet/hextet.toml），
# 网络密钥 / 节点密钥都在那里，本文件里绝不放任何密钥。

config hextet 'hextet'
	# 是否由 procd 拉起 daemon（默认关，需显式打开）
	option enabled '0'
	# hextet.toml 路径
	option config_file '/etc/hextet/hextet.toml'
	# 打开后给 `hextet daemon` 加 -v（DEBUG 日志）
	option verbose '0'

# ---------------------------------------------------------------------------
# hextet.toml 模板（占位值，无任何真实密钥）
# 复制下面内容到 /etc/hextet/hextet.toml，然后按需修改。网络密钥是 32 字节
# base64，用 `hextet init`（新建网络）或 `hextet init --network-key ...`（加入）
# 生成，不要手写；节点密钥用 `hextet keygen --out /etc/hextet/node.key` 生成。
#
#   [network]
#   name = "example-net"
#   key = "<your-network-key>"
#
#   [node]
#   key_file = "/etc/hextet/node.key"
#   listen_port = 4193
#   state_dir = "/var/lib/hextet"
#
#   # 每个对端一个 [[peers]] 块（endpoint 必须是 IPv6，hextet 是 IPv6-only）：
#   # [[peers]]
#   # name = "nas"
#   # public_key = "<peer-public-key>"
#   # endpoints = ["[2001:db8::2]:4193"]
