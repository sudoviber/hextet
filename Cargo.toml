[workspace]
resolver = "3"
members = ["crates/core", "crates/wg", "crates/platform", "crates/cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sudoviber/hextet"
rust-version = "1.85"

[workspace.dependencies]
hextet-core = { path = "crates/core" }
hextet-wg = { path = "crates/wg" }
hextet-platform = { path = "crates/platform" }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
wireguard-control = "2"
rtnetlink = "0.21"
futures = "0.3"
libc = "0.2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "signal",
] }
proptest = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
