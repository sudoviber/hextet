[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/core-ffi",
  "crates/wg",
  "crates/wg-userspace",
  "crates/platform",
  "crates/engine",
  "crates/discovery",
  "crates/proto",
  "crates/cli",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sudoviber/hextet"
rust-version = "1.85"

[workspace.dependencies]
hextet-core = { path = "crates/core" }
hextet-core-ffi = { path = "crates/core-ffi" }
hextet-wg = { path = "crates/wg" }
hextet-wg-userspace = { path = "crates/wg-userspace" }
hextet-platform = { path = "crates/platform" }
hextet-engine = { path = "crates/engine" }
hextet-discovery = { path = "crates/discovery" }
hextet-proto = { path = "crates/proto" }
hmac = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
wireguard-control = "2"
rtnetlink = "0.21"
futures = "0.3"
libc = "0.2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "signal",
] }
proptest = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
# UniFFI（Mozilla，MPL-2.0）：M7 Android FFI 边界（crates/core-ffi）。精确锁版本，
# 沿用 mainline/boringtun/tun 的锁版本先例。proc-macro 时代（`#[uniffi::export]` +
# `uniffi::setup_scaffolding!()`），不写 .udl、不写 build.rs（见 ADR-0012）。
# `default-features = false` 关掉 `cargo-metadata`（仅 bindgen 工具链读 Cargo.toml 元
# 数据用，运行时 proc-macro 路径不需要）。
uniffi = { version = "=0.32.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
