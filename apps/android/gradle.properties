# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is not currently a dependency of this slice, but keep the flag set so adding
# AndroidX later (e.g. NotificationCompat) does not surprise anyone.
android.useAndroidX=true

# Keep non-transitive R classes to shrink the (future) release build.
android.nonTransitiveRClass=true

kotlin.code.style=official
