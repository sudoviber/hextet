[package]
name = "hextet-wg-userspace"
description = "hextet userspace WireGuard backend (gotatun)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
hextet-wg.workspace = true
tokio.workspace = true
# gotatun 0.8.1（ADR-0012 定方向的数据面，替换 boringtun 过渡后端）。锁死版本、
# 全部封装在本 crate 内不向外部暴露 gotatun 类型。ring 提供方避开 aws-lc-rs
# 交叉编译坑（spec §13）；`tun` feature 走 `tun` crate（utun/wintun/TUN 分支）。
gotatun = { version = "=0.8.1", default-features = false, features = ["device", "tun", "ring"] }
# Peer.allowed_ips 的类型（gotatun 的 Peer 直接暴露 `Vec<ipnetwork::IpNetwork>`），
# 版本与 gotatun 0.8.1 锁定的一致。
ipnetwork = "0.21"

[dev-dependencies]
# 冒烟测试里构造原始数据包（Packet::from_bytes 需要 BytesMut）。
bytes = "1"
# 真实 TUN 冒烟测试里探测 euid==0（root）用；只在 Linux 测试里出现一次。
libc.workspace = true
