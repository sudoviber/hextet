[package]
name = "hextet-engine"
description = "hextet embeddable engine: punch state machine, endpoint cache, daemon loop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
hextet-core.workspace = true
hextet-wg.workspace = true
hextet-platform.workspace = true
hextet-discovery.workspace = true
hextet-proto.workspace = true
anyhow.workspace = true
axum = "0.8"
rand_core.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing.workspace = true

# 桌面 macOS/Windows 走 gotatun 用户态后端（platform_default）；Unix 系（含 Linux/Android）
# 还要给 `daemon::spawn_with_fd`（M7 切片 B/C：Android VpnService fd 数据面）用
# `UserspaceBackend::apply_with_fd`。故放宽到所有 Unix + Windows。
[target.'cfg(any(unix, windows))'.dependencies]
hextet-wg-userspace.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
