[package]
name = "hextet-engine-ffi"
description = "hextet engine FFI (UniFFI) for Android / future bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# cdylib 供 Android JNI / 未来绑定加载；lib 供本机 cargo test 直接调函数。
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
hextet-core.workspace = true
hextet-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
# daemon 生命周期 FFI 的内嵌 runtime（daemon 后台任务跑在上面）。
tokio.workspace = true
# UniFFI（M7 engine FFI 化）：UDL（`src/hextet.udl` + `build.rs` 的 `generate_scaffolding`
# + `include_scaffolding!`）。本 crate 只用 Rust scaffolding（编译 + 单测）；Kotlin 绑定
# 生成留到 Android 集成时再加 `cli` feature（uniffi-bindgen）。
uniffi = "0.32"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }
