[package]
name = "hextet-cli"
description = "hextet command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "hextet"
path = "src/main.rs"

[dependencies]
hextet-core.workspace = true
hextet-wg.workspace = true
hextet-platform.workspace = true
hextet-engine.workspace = true
hextet-discovery.workspace = true
hextet-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand_core.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(target_os = "macos")'.dependencies]
hextet-wg-userspace.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# ADR-0010 决策 4：Windows 服务化走 `windows-service`（Mullvad 维护，MIT OR Apache-2.0）。
# 精确锁版本；unsafe 内聚 crate 内。注意其 `define_windows_service!` 宏会展开出 `unsafe`
# 块，本仓库用安全 `extern "system" fn` 替代，见 `commands/service.rs` 模块文档。
windows-service = "=0.8.1"
