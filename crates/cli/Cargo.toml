[package]
name = "hextet-cli"
description = "hextet command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "hextet"
path = "src/main.rs"

[dependencies]
hextet-core.workspace = true
hextet-wg.workspace = true
hextet-platform.workspace = true
hextet-engine.workspace = true
hextet-discovery.workspace = true
hextet-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand_core.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
hextet-wg-userspace.workspace = true
