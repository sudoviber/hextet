[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "MPL-2.0",
  # wireguard-control (crates/wg kernel 后端) 是 LGPL-2.1-or-later；
  # 弱 copyleft，动态链接/独立编译单元使用不要求本项目开源。
  "LGPL-2.1-or-later",
  # tun crate (meh/rust-tun, crates/platform 的 TUN 设备抽象) 是 WTFPL（非 SPDX
  # 标准宽松许可）。ADR-0007 决策 2 选它承载 ioctl/utun 的安全封装；若日后成为合规
  # 障碍，按 ADR 切换到 tokio-tun（MIT OR Apache-2.0）。
  "WTFPL",
  # webpki-roots（Mozilla CA 根证书库，经 reqwest 的 rustls-tls 特性传入，DDNS
  # updater 的 HTTPS 客户端用它做根信任）是 CDLA-Permissive-2.0——Mozilla 对 CA
  # 数据采用的宽松数据许可，再分发友好；是 reqwest+rustls 的标准根证书来源。
  "CDLA-Permissive-2.0",
]

[advisories]
yanked = "deny"
ignore = [
  # paste（编译期 proc-macro，无运行时攻击面）经
  # netlink-packet-utils -> wireguard-control 传入；上游未提供安全替代升级路径。
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro pulled transitively via wireguard-control -> netlink-packet-utils; no upstream fix, no runtime surface" },
]

[bans]
multiple-versions = "warn"
